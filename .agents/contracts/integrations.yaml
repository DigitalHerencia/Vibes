id: vibes.integrations
version: 1
authority: current-source-contract
providers:
  clerk:
    status: code-present
    owns: [identity, session, account_ui]
    webhook_route: /api/clerk/webhooks
  neon:
    status: code-present
    owns: [postgresql_service]
  stripe:
    status: not-implemented
rules:
  provider_secrets_server_only: true
  browser_redirect_is_not_provider_truth: true
  webhook_reconciliation_required: true
  live_configuration_requires_separate_verification: true
