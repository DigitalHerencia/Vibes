id: vibes.routes
version: 1
authority: current-source-contract
public: ["/", "/pricing", "/faq"]
auth: ["/sign-in", "/sign-up"]
protected: ["/dashboard", "/projects", "/projects/new", "/projects/[projectId]", "/settings"]
api: ["/api/clerk/webhooks", "/api/stripe/webhooks", "/api/stripe/connect/webhooks"]
reference_catalog:
  status: production-opt-in
  route_groups:
    - app/(presentation)
    - app/(public)/(presentation)
    - app/(auth)/(presentation)
    - app/(tenant)/(presentation)
  index: /catalog
  production_gate: PRESENTATION_CATALOG_ENABLED
  search_metadata: content/presentation/registry.ts
  robots: noindex,nofollow
